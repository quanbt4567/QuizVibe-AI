<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found — QuizVibe AI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        background-color: #06080D;
        color: #F8FAFC;
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        background: #0B0E17;
        border: 1px solid #1E2433;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.65);
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 0.75rem;
        font-weight: 700;
        color: #6366F1;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.5rem 0; color: #FFFFFF; }
      p { font-size: 0.875rem; color: #94A3B8; line-height: 1.6; margin: 0 0 1.5rem 0; }
      .btn {
        display: inline-block;
        background: #6366F1;
        color: #FFFFFF;
        font-weight: 700;
        font-size: 0.875rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .btn:hover { background: #4F46E5; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">404 &bull; NOT FOUND</div>
      <h1>Trang Không Tồn Tại</h1>
      <p>Đường dẫn bạn yêu cầu không tồn tại trên hệ thống QuizVibe AI hoặc đã được chuyển sang địa chỉ khác.</p>
      <a href="/" class="btn">Quay Về Trang Chủ</a>
    </div>
  </body>
</html>
